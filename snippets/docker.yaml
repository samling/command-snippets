snippets:
  - id: 5bb9acd1-d89e-4afe-8c5e-a42091027526
    name: Run a container with options
    description: Build a docker run command without executing it.
    tags: [Docker, Containers]
    command: docker run {{detach}} {{env}} {{name}} {{image}}
    inputs:
      - {name: detach, kind: toggle, flag: -d, default: false}
      - name: env
        label: Environment variable
        kind: repeat
        flag: -e
        default: []
        validate: {pattern: '^[A-Za-z_][A-Za-z0-9_]*=.*$'}
      - {name: name, kind: flag, flag: --name}
      - {name: image, required: true, default: 'nginx:latest'}
  - id: 4097ead8-1662-4ae8-916e-d5e1136b8015
    name: Follow container logs
    tags: [Docker, Monitoring]
    command: docker logs -f {{container}} {{tail}}
    inputs:
      - {name: container, required: true}
      - name: tail
        kind: flag
        flag: --tail
        default: "100"
        validate: {range: [1, 100000]}
