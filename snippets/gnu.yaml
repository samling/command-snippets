snippets:
  - id: aee99d8f-7dc6-46ed-b7ed-ab3611c03322
    name: Find text in files
    tags: [Files, Search]
    command: grep {{recursive}} -E {{pattern}} {{path}}
    inputs:
      - {name: recursive, kind: toggle, flag: -r, default: true}
      - name: pattern
        required: true
        validate: {regex: true}
      - {name: path, default: .}
  - id: 63052fc0-8434-492b-b13a-b48cb35e7c9b
    name: List directory sizes
    tags: [Files, Monitoring]
    command: du -h --max-depth=1 {{path}} | sort -h
    inputs:
      - {name: path, default: .}
