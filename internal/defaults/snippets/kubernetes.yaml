# Kubernetes-specific command snippets
computed_templates:
  namespace:
    description: "Kubernetes namespace flag"
    cases:
      - when: namespace == "all"
        value: "-A"
      - when: '!empty(namespace)'
        value: '${flag("-n", namespace)}'
      - default: true
        value: ""

snippets:
  kubectl-describe-pod:
    id: "kubectl-describe-pod"
    name: "kubectl-describe-pod"
    description: "Describe a specific pod"
    command: "kubectl describe pod ${pod_name_arg} ${namespace}"
    variables:
      - name: "pod_name"
        description: "Pod name to describe"
        required: true
      - name: "namespace"
        description: "Namespace name, all, or empty"
        default: ""
        computed_template: "namespace"
    computed:
      pod_name_arg:
        value: "pod_name"
    tags: ["kubernetes", "describe", "pods"]
    created_at: "2025-01-01T00:00:00Z"
    updated_at: "2025-01-01T00:00:00Z"

  kubectl-get-services:
    id: "kubectl-get-services"
    name: "kubectl-get-services"
    description: "Get Kubernetes services"
    command: "kubectl get services ${namespace}"
    variables:
      - name: "namespace"
        description: "Namespace name, all, or empty"
        default: ""
        computed_template: "namespace"
    tags: ["kubernetes", "services"]
    created_at: "2025-01-01T00:00:00Z"
    updated_at: "2025-01-01T00:00:00Z"

  kubectl-apply:
    id: "kubectl-apply"
    name: "kubectl-apply"
    description: "Apply Kubernetes manifests"
    command: "kubectl apply -f ${manifest_file_arg} ${namespace}"
    variables:
      - name: "manifest_file"
        description: "Path to Kubernetes manifest file"
        required: true
      - name: "namespace"
        description: "Namespace name, all, or empty"
        default: ""
        computed_template: "namespace"
    computed:
      manifest_file_arg:
        value: "manifest_file"
    tags: ["kubernetes", "apply", "manifest"]
    created_at: "2025-01-01T00:00:00Z"
    updated_at: "2025-01-01T00:00:00Z"

  kubectl-get-pods:
    id: "kubectl-get-pods"
    name: "kubectl-get-pods"
    description: "Get Kubernetes pods with namespace selection"
    command: "kubectl get pods ${namespace}"
    variables:
      - name: "namespace"
        description: "Namespace name, all, or empty"
        default: ""
        computed_template: "namespace"
    tags: ["kubernetes", "pods"]
    created_at: "2025-01-01T00:00:00Z"
    updated_at: "2025-01-01T00:00:00Z"

  kubectl-get-pods-conditional-namespace:
    id: "kubectl-get-pods-conditional-namespace"
    name: "kubectl-get-pods-conditional-namespace"
    description: "Get pods with optional namespace selection"
    command: "kubectl get pods ${namespace}"
    variables:
      - name: "namespace"
        description: "Namespace name, all, or empty"
        default: ""
        computed_template: "namespace"
    tags: ["kubernetes", "pods", "example", "conditional"]
    created_at: "2025-01-01T00:00:00Z"
    updated_at: "2025-01-01T00:00:00Z"

  kubectl-logs:
    id: "kubectl-logs"
    name: "kubectl-logs"
    description: "Get logs from a pod in a namespace"
    command: "kubectl logs ${pod_name_arg} ${namespace} ${follow_arg}"
    variables:
      - name: "pod_name"
        description: "Pod name"
        required: true
      - name: "namespace"
        description: "Namespace name, all, or empty"
        default: ""
        computed_template: "namespace"
      - name: "follow"
        description: "Follow logs"
        type: "boolean"
        default: "false"
    computed:
      pod_name_arg:
        value: "pod_name"
      follow_arg:
        value: 'boolFlag("-f", follow)'
    tags: ["kubernetes", "logs"]
    created_at: "2025-01-01T00:00:00Z"
    updated_at: "2025-01-01T00:00:00Z"

  kubectl-port-forward:
    id: "kubectl-port-forward"
    name: "kubectl-port-forward"
    description: "Forward local port to pod or service"
    command: "kubectl port-forward ${resource_arg} ${port_mapping_arg} ${namespace}"
    variables:
      - name: "resource_type"
        required: true
        description: "Resource type: [pod, svc]"
        default: "svc"
        choices: ["pod", "svc"]
      - name: "resource_name"
        required: true
        description: "Resource name (e.g., my-pod, my-service)"
      - name: "host_port"
        description: "Host port (e.g., 8080)"
        required: true
        type: "port"
      - name: "target_port"
        description: "Target port (leave empty to use host port)"
        default: ""
        type: "port"
      - name: "namespace"
        description: "Namespace name, all, or empty"
        default: ""
        computed_template: "namespace"
    computed:
      resource_arg:
        value: 'resource_type + "/" + resource_name'
      port_mapping_arg:
        value: 'host_port + ":" + default(target_port, host_port)'
    tags: ["kubernetes", "port-forward", "networking"]
    created_at: "2025-01-01T00:00:00Z"
    updated_at: "2025-01-01T00:00:00Z"

  kubectl-get-pods-advanced:
    id: "kubectl-get-pods-advanced"
    name: "kubectl-get-pods-advanced"
    description: "Advanced kubectl get pods with multiple options"
    command: "kubectl get pods ${namespace} ${output_arg} ${selector_arg}"
    variables:
      - name: "namespace"
        description: "Namespace name, all, or empty"
        default: ""
        computed_template: "namespace"
      - name: "output"
        description: "Output format"
        choices: ["", "wide", "yaml", "json"]
        empty_label: "default"
      - name: "selector"
        description: "Label selector"
        default: ""
    computed:
      output_arg:
        value: 'flag("-o", output)'
      selector_arg:
        value: 'flag("--selector", selector)'
    tags: ["kubernetes", "pods", "advanced"]
    created_at: "2025-01-01T00:00:00Z"
    updated_at: "2025-01-01T00:00:00Z"
