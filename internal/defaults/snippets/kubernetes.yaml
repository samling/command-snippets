snippets:
  - id: 33f4fe80-8732-48c7-8183-4de4fd2fb003
    name: List pods
    description: List pods in the current namespace, a named namespace, or all namespaces.
    tags: [Kubernetes]
    command: kubectl get pods {{namespace}}
    inputs:
      - name: namespace
        label: Namespace
        help: Leave empty for the current namespace; enter all for all namespaces.
        kind: flag
        flag: -n
        special: {all: -A}
  - id: 1cda91ea-5612-4263-816f-7dad0e4f4263
    name: Pod resource usage, sorted
    description: Show pod CPU or memory usage, highest first.
    tags: [Kubernetes, Monitoring]
    command: |-
      kubectl top pods {{namespace}} --no-headers |
        awk 'NF == 3 {print "-", $0; next} {print}' |
        { header='NAMESPACE NAME CPU MEMORY'; printf '%s\n' "$header"; sort -k{{sort_by}},{{sort_by}} -h -r; }
    inputs:
      - name: namespace
        label: Namespace
        kind: flag
        flag: -n
        special: {all: -A}
      - name: sort_by
        label: Sort by
        kind: choice
        default: CPU
        choices:
          - {label: CPU, value: "3"}
          - {label: Memory, value: "4"}
  - id: 584b5121-61fd-496d-80a5-957ca043cc74
    name: Get pods in a chosen namespace
    tags: [Kubernetes]
    command: kubectl get pods {{mode}} {{namespace}}
    inputs:
      - name: mode
        kind: choice
        choices:
          - {label: Default, value: ""}
          - {label: All, value: -A}
          - {label: Named, value: ""}
      - name: namespace
        kind: flag
        flag: -n
        visible_when: {input: mode, equals: Named}
        required_when: {input: mode, equals: Named}
        validate: {pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
  - id: 7211d15e-3baa-4de5-8275-2e885b0ba46c
    name: Forward a service port
    tags: [Kubernetes, Networking]
    command: kubectl port-forward {{resource}} {{ports}} {{namespace}}
    inputs:
      - {name: service, required: true}
      - name: host_port
        default: "8080"
        required: true
        validate: {range: [1, 65535]}
      - name: target_port
        validate: {range: [1, 65535]}
      - {name: namespace, kind: flag, flag: -n}
    expressions:
      resource: 'quote("svc/" + inputs.service)'
      ports: 'quote(inputs.host_port + ":" + default(inputs.target_port, inputs.host_port))'
