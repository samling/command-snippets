snippets:
  - id: 00525e6c-47db-42fe-b981-3fe855b8ba5a
    name: Git status
    tags: [Git]
    command: git status --short
  - id: 0a794128-4daa-4090-9ee3-1cf4bafb33cd
    name: Commit staged changes
    tags: [Git]
    command: git commit -m {{message}}
    inputs:
      - {name: message, label: Commit message, required: true}
  - id: df5a022b-bed4-45c3-96dd-1ac65d8cd37e
    name: Find commits by message
    tags: [Git, Search]
    command: git log --oneline {{pattern}}
    inputs:
      - name: pattern
        kind: flag
        flag: --grep
        required: true
        validate: {regex: true}
